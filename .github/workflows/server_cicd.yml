name: Server PR
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - client/**
      - proto/
      - .github/workflows/client_cicd.yml

jobs:
  test-and-build:
    name: Test & Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag phonebook-server:${{ github.sha }}